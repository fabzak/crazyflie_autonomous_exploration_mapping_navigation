# Real Crazyswarm2 inventory.  Non-runnable until the operator replaces both
# identity placeholders and enables the robot.
fileversion: 3

robots:
  __ROBOT_NAME__:
    enabled: false
    uri: "__RADIO_URI__"
    initial_position: [0.0, 0.0, 0.0]
    type: cf21_real
    reference_frame: "__ROBOT_NAME__/odom"

robot_types:
  cf21_real:
    motion_capture:
      tracking: "librigidbodytracker"
      marker: default_single_marker
      dynamics: default
    big_quad: false

all:
  firmware_logging:
    enabled: true
    # Pose is absent: odometry is the single pose/TF source on this
    # no-motion-capture real path.
    default_topics:
      odom:
        # The odom callback is the only publisher of the dynamic
        # <robot>/odom -> <robot> TF, and layer_explore looks transforms up at
        # each scan's own stamp with tf_timeout_sec.  At 10 Hz the newest
        # sample is routinely older than the requested time and observations
        # are dropped, so this is a mapping parameter, not just a telemetry
        # one.  Check the link sustains it in preflight.
        frequency: 20
      status:
        # 10 Hz against the 1.0 s status_timeout_sec in real_safety.yaml
        # leaves several packets of margin before the control-adapter gate and
        # the latching safety watchdog trip in flight.
        frequency: 10
    # One generic log packet carries every Multi-ranger channel; the adapter
    # validates this order before splitting it into six LaserScan topics.
    custom_topics:
      range_raw:
        frequency: 10
        vars:
          - range.front
          - range.right
          - range.back
          - range.left
          - range.up
          - range.zrange
      # Diagnostic only: squal says whether the Flow deck could see the floor
      # at all, outlierCount exposes flow the estimator measured and then
      # rejected, and stateEstimate.v[xy] is what the controller acted on -
      # together enough to tell a blind sensor from a stationary airframe.
      # 15 bytes (1+2+2+1+1+4+4), inside the 26-byte CRTP log packet, at
      # range_raw's 10 Hz so the validated odom rate is undisturbed.
      flow_raw:
        frequency: 10
        vars:
          - motion.motion
          - motion.deltaX
          - motion.deltaY
          - motion.squal
          - motion.outlierCount
          - stateEstimate.vx
          - stateEstimate.vy
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2  # Kalman
      controller: 1  # PID
    kalman:
      # The Flow deck sits ~1.4 cm above the floor, below its minimum range,
      # so a grounded Crazyflie feeds the estimator unusable flow and its
      # position integrates away (measured +39 m after being hand-carried,
      # ~7 m in 20 s sitting still).  The estimate only zeroes on boot, and
      # layer_explore maps into a fixed +/-16.25 m grid around the odometry
      # origin.
      # Declaring it here resets at connect and creates the ROS parameter
      # <robot>.params.kalman.resetEstimation for a pre-takeoff re-trigger;
      # the firmware self-clears the flag (estimator_kalman.c:221-223), so it
      # is one-shot.
      resetEstimation: 1
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1
