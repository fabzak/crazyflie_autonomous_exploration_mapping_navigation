# Conservative real-hardware overrides for the existing layer_explore node.
# Every motion value is an unvalidated engineering starting point.
layer_explore:
  ros__parameters:
    use_sim_time: false
    robot_name: "__ROBOT_NAME__"
    map_frame: map
    stable_frame: "__ROBOT_NAME__/odom"
    body_frame: "__ROBOT_NAME__"

    # [POTREBNA PROVJERA] Conservative real motion envelope, unvalidated.
    cruise_speed_mps: 0.20
    climb_speed_mps: 0.10

    # Layer altitudes are measured in flight (PROBE -> layers_below_ceiling),
    # not listed here.  Only the spacing is overridden, tighter than the 0.50 m
    # default for a low indoor room; the layer count is whatever the room
    # supports, and layer_ceiling_clearance_m keeps its 0.50 m default.
    layer_spacing_m: 0.40

    # max_layers and halt_after_state stay at their unbounded defaults: the
    # real profile imposes no mission bound.

    # Real-hardware operator gate.  layer_explore holds motionless, publishing
    # an explicit zero command, until real_operator_control publishes True
    # here in response to the operator's G key.  Empty in simulation.
    start_gate_topic: "/real_operator/autonomy_authorized"

    # Hand-measured in the flight room: three static (odom z + up ranger)
    # readings gave 2.74 / 2.82 / 2.85 m.  Fallback only - the up ranger sees
    # the ceiling well inside its 3.49 m range - used when the plane estimator
    # cannot resolve a real surface.
    fallback_floor_height_m: 0.0
    fallback_ceiling_height_m: 2.80

    # Overhead margin the up ranger must still see beyond the remaining climb
    # before TAKEOFF or ASCEND may continue; slightly under the 0.35 m default.
    ascend_min_headroom_m: 0.30
    takeoff_min_height_m: 0.20
    takeoff_overshoot_m: 0.03

    # The real control adapter clamps yaw to max_yaw_rate_radps (0.30), and
    # layer_explore sizes the SCAN timeout as angle/scan_yaw_rate, so a
    # commanded rate above the cap is clamped and the sweep times out before
    # it completes.  Slower yaw also keeps the Flow deck's estimate cleaner.
    scan_yaw_rate: 0.25

    # Real Multi-ranger streams, not Gazebo's synthetic full scan.
    use_gazebo_full_scan: false
    freshness_timeout_sec: 0.50
    maximum_sensor_age_sec: 0.35
    # layer_explore.py applies max(0.5, value), so anything lower is inert.
    future_timestamp_tolerance_sec: 0.50
    future_observation_queue_timeout_sec: 0.50
    geometry_update_rate_hz: 10.0
    tf_timeout_sec: 0.05
    sensor_fov_deg: 27.0
    maximum_return_epsilon_m: 0.01

    # Keep recovery motion slower than the already conservative cruise speed.
    close_obstacle_escape_speed_mps: 0.05
    close_obstacle_escape_acceleration_mps2: 0.10
    close_obstacle_recovery_attempts: 1
